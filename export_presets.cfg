; Hollowkin Windows Desktop 导出预设【骨架】
; ---------------------------------------------------------------------------
; ADR-6（2026-11-06）：目标平台为 Windows Desktop 单平台，移动端已彻底放弃。
; 原 Android [preset.0]（APK / Gradle / keystore / SDK）已删除，不再保留兼容预设。
; Wave 4（2026-11-07）：两个预设均已在 Godot 4.3 headless 下实导出成功（EXIT=0），
; 导出的 exe 也真实启动并通过自检 / 采集 smoke；模板与 rcedit 处理见下方第 1)/2) 条。
; 用编辑器打开「项目 -> 导出」仍可补全其余默认项，但不影响命令行导出。
;
; Wave 3 后有两个预设，均指向当前 project.godot 的 run/main_scene：
;   - [preset.1] "Windows Desktop Game"：导出可玩的 PC 主画面
;     （src/main.tscn，四主屏 + 战斗屏，横屏 1280x720），无需切换场景。
;   - [preset.0] "Windows Desktop Probe"：仅用于 R1/R3 PC 基线采集。
;     Godot 导出预设不覆盖 main_scene，故采集时须临时把 project.godot 的
;     run/main_scene 指向 res://src/qa/probe_runner.tscn，测完务必改回。
;
; 导出前必须依次确认：
;   1) 编辑器 -> 管理导出模板 -> 安装 4.3.stable 导出模板（Windows Desktop 亦需要）。
;      本会话已把 4 个 x86_64 模板 + version.txt 装到 Godot export_templates/4.3.stable/；
;      官方 tpz 为 1.07GB 全平台包，这里仅用 HTTP Range 取 Windows 所需条目。
;   2) rcedit：预设已设 application/modify_resources=false，跳过图标/版本信息改写，
;      无需 rcedit 即可导出；正式发布需图标/版本信息时再配置 rcedit 并改回 true。
;   3) 采集用 preset.0 时把 src/qa/probe_runner.gd 的 PROBE_BUILD_SHA 填成 git SHA；
;   4) 窗口 / 全屏各跑一轮；debug 与 release 分开归档、禁止混算；
;   5) 导出产物 build/ 不要提交到仓库（见 .gitignore）。
;   6) 两个预设均 exclude_filter="addons/gut/*"：GUT 由 CI 单独安装，
;      属开发期依赖，不进发布 / 采集包（Wave 4 导出实测后收紧）。
; 采集口径：PC 窗口 / 全屏基线，见 docs/qa/evidence/_template/README.md。
; 方法学参考（仅历史）：docs/qa/archive/r1r3-device-test-plan.md（已归档，不作现行判据）。
; R1 / R3 仍为 CONCERNS；CONCERNS 不因平台变更或归档自动翻转。
; ---------------------------------------------------------------------------

[preset.0]

name="Windows Desktop Probe"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/gut/*"
export_path="build/hollowkin_probe.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"
debug/export_console_wrapper=1
; Wave 4：跳过 rcedit 资源改写（图标 / 版本信息），使无 rcedit 的机器也能导出。
; 需要正式图标 / 版本信息时，在编辑器设置里配置 rcedit 并把此项改回 true。
application/modify_resources=false
texture_format/s3tc=true

