name: Lint

# 2026-11-05 范围决策：暂时只在 Windows 运行，不做 Linux 侧验证。
on:
  push:
  pull_request:

jobs:
  gd-lint:
    runs-on: windows-latest
    # 防御：lint 脚本异常挂起时不要占满 Actions 默认的 360 分钟。
    # 与 test.yml 的 gut job（timeout-minutes: 15）保持同一防护口径。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ban global random calls (ADR-5)
        # 显式指定 UTF-8：Windows runner 默认单字节 stdout 会让脚本的中文提示
        # 抛 UnicodeEncodeError，导致误判为 lint 失败（脚本内亦有防御）。
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/ci/lint_no_global_random.py --root .
