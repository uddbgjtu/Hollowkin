name: Lint

on:
  push:
  pull_request:

jobs:
  gd-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ban global random calls (ADR-5)
        run: python tools/ci/lint_no_global_random.py --root .
